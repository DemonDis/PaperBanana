# Конфигурация моделей и API для PaperVizAgent

# Модели по умолчанию (не должны быть пустыми — используются для всех вызовов генерации)
defaults:
  main_model_name: "gemini-3.1-pro-preview"
  image_gen_model_name: "gemini-3.1-flash-image-preview"
  
# Ключи API. Если вы используете модели Gemini, можно оставить остальные ключи пустыми.
api_keys:
  openrouter_api_key: "" # например, "sk-or-v1-xxxxx". Укажите model_name в формате "openrouter/<модель>" для использования.
  openrouter_base_url: "https://openrouter.ai/api/v1" # Настройте, если используется другой совместимый с OpenAI эндпоинт.
